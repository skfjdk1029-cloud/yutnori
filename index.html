<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>윷놀이 v59</title>
<style>
*{box-sizing:border-box}
body{
  user-select:none;
  margin:0;
  background:#f6f1e7;
  color:#222;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:auto;
}
button,input{font:inherit}
button{
  border:1px solid #3b302a;
  background:#fff;
  border-radius:10px;
  padding:9px 12px;
  cursor:pointer;
}
button:hover{background:#f1e4ce}
button:disabled{opacity:.45;cursor:not-allowed}
.screen{
  width:100vw;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.card{
  width:min(760px,96vw);
  background:#fffaf0;
  border:2px solid #3b302a;
  border-radius:18px;
  padding:22px;
  box-shadow:0 12px 25px rgba(0,0,0,.12);
}
h1{margin:0 0 10px;font-size:32px}
h2{margin:18px 0 8px;font-size:19px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.modeBtn.active{background:#3b302a;color:#fff}
.startBtn{
  margin-top:18px;
  width:100%;
  padding:14px;
  font-size:18px;
  background:#2f241f;
  color:white;
}

.game{
  width:1920px;
  height:1080px;
  display:grid;
  grid-template-columns:340px 1fr 430px;
  gap:18px;
  padding:18px;
  margin:0 auto;
  background:#efe1c8;
}
.leftPanel,.boardPanel,.sidePanel{
  background:#fffaf0;
  border:2px solid #3b302a;
  border-radius:18px;
  padding:14px;
  min-height:0;
}
.leftPanel{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.boardPanel{
  position:relative;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding-top:18px;
  padding-bottom:190px;
  overflow:hidden;
}
.sidePanel{
  display:flex;
  flex-direction:column;
  min-height:0;
}
#board{
  width:860px;
  height:860px;
  display:block;
  background:#fff8e9;
  border-radius:16px;
  border:1px solid rgba(59,48,42,.18);
}
.node{fill:#fff;stroke:#3b302a;stroke-width:3}
.corner{fill:#f3dfb8}
.center{fill:#ffe1a6}
.startNode{fill:#e9f7ff}
.path{stroke:#6b5144;stroke-width:5;stroke-linecap:round;fill:none;opacity:.45}
.piece{stroke:#1c1715;stroke-width:2.5;cursor:pointer}
.pieceText{font-size:12px;font-weight:800;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.selected{stroke:#000;stroke-width:5;filter:drop-shadow(0 0 5px rgba(0,0,0,.55))}
.infoBox{
  border:1px solid #6b5144;
  border-radius:12px;
  padding:10px;
  background:#fffdf8;
  margin-bottom:10px;
}
.turnTitle{
  font-weight:900;
  font-size:20px;
  display:flex;
  align-items:center;
  gap:10px;
}
.turnColorDot{
  width:22px;
  height:22px;
  border-radius:50%;
  border:3px solid #1c1715;
  display:inline-block;
}
.small{font-size:14px;opacity:.82}
.cards{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.moveCard{
  width:62px;
  height:62px;
  border:2px solid #3b302a;
  border-radius:50%;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  cursor:pointer;
  font-size:16px;
  font-weight:900;
  line-height:1.05;
  padding:0;
}
.moveCard.active{background:#2f241f;color:white}
.log{
  height:215px;
  overflow:auto;
  background:#211b18;
  color:#f9efd9;
  border-radius:12px;
  padding:10px;
  font-size:13px;
  line-height:1.45;
}
.hidden{display:none}
.rules{
  font-size:13px;
  line-height:1.45;
  background:#fffdf8;
  border:1px dashed #6b5144;
  padding:10px;
  border-radius:12px;
}
.yutArea{
  background:#f4e3c3;
  border:2px solid #6b5144;
  border-radius:14px;
  padding:12px;
  margin-top:10px;
  min-height:128px;
}
.yutStage{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:center;
  min-height:78px;
}
.stick{
  width:36px;
  height:76px;
  border-radius:18px;
  border:2px solid #3b302a;
  background:linear-gradient(90deg,#b86b28,#e3a15b);
  box-shadow:0 4px 8px rgba(0,0,0,.18);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:12px;
  color:#3b2415;
  position:relative;
  transition:transform .25s ease;
}
.stick.back{background:linear-gradient(90deg,#fff9ea,#f0dfbd)}
.stick.back::after{
  content:"";
  width:10px;
  height:10px;
  background:#3b2415;
  border-radius:50%;
  position:absolute;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
}
.stick.baekdo{
  background:linear-gradient(90deg,#fff6dd,#e6ca93);
  color:#8b1d1d;
  writing-mode:vertical-rl;
  letter-spacing:1px;
}
.stick.baekdo::after{
  content:"";
  width:9px;
  height:9px;
  background:#8b1d1d;
  border-radius:50%;
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
}

.stick.baekdoMark::before{
  content:"백도윷\A▼";
  white-space:pre;
  position:absolute;
  top:-42px;
  left:50%;
  transform:translateX(-50%);
  writing-mode:horizontal-tb;
  letter-spacing:-.5px;
  color:#d83a2e;
  font-size:12px;
  line-height:1.05;
  font-weight:1000;
  text-align:center;
  text-shadow:0 2px 0 rgba(255,255,255,.88);
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.18));
  animation:baekdoPointerBounce .72s ease-in-out infinite;
  z-index:4;
  pointer-events:none;
}
@keyframes baekdoPointerBounce{
  0%,100%{transform:translateX(-50%) translateY(0)}
  50%{transform:translateX(-50%) translateY(-8px)}
}
body.mobile:not(.yutThrowing) .mobileYutSlot .stick.baekdoMark::before{
  content:"▼";
  top:-17px;
  font-size:14px;
  line-height:1;
}
body.mobile.yutThrowing .mobileYutSlot .stick.baekdoMark::before{
  top:-40px;
  font-size:12px;
}
.stick.rolling{animation:toss .55s ease-in-out infinite alternate}
.stick:nth-child(2){transform:rotate(-5deg)}
.stick:nth-child(3){transform:rotate(6deg)}
.stick:nth-child(4){transform:rotate(-2deg)}
@keyframes toss{
  0%{transform:translateY(0) rotate(-18deg)}
  50%{transform:translateY(-22px) rotate(35deg)}
  100%{transform:translateY(6px) rotate(-28deg)}
}
.yutResult{text-align:center;font-weight:900;font-size:18px;margin-top:6px}
.hintArrowShadow{
  fill:rgba(0,0,0,.22);
